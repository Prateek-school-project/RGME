<text fill="#fffaf0" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="1.2"><textPath href="#topArc" startOffset="50%" text-anchor="middle">LATE RAJIV GANDHI MEMORIAL HIGH SCHOOL &amp; JR. COLLEGE</textPath></text>
<text fill="#fff2c9" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="1.5"><textPath href="#bottomArc" startOffset="50%" text-anchor="middle">KARANJA (GH)</textPath></text>
