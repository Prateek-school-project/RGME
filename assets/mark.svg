<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Late Rajiv Gandhi Memorial High School and Junior College crest</title>
<desc id="desc">A red circular school crest with a golden laurel, a flame and open book, Karanja Ghadge, and the motto Vidya Paramam Balam.</desc>
<defs>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c62749"/><stop offset=".5" stop-color="#990d32"/><stop offset="1" stop-color="#700b28"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff09a"/><stop offset=".42" stop-color="#f7c634"/><stop offset="1" stop-color="#c98208"/></linearGradient>
 <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f14c34"/><stop offset=".5" stop-color="#ffb13b"/><stop offset="1" stop-color="#f5d775"/></linearGradient>
 <path id="topArc" d="M 215,440 A 285,285 0 0 1 785,440"/>
 <path id="bottomArc" d="M 215,440 A 285,285 0 0 0 785,440"/>
 <g id="leaf"><path d="M0 0C-32-22-35-62-2-84C20-53 18-22 0 0Z" fill="url(#gold)" stroke="#9b680e" stroke-width="3"/><path d="M0-5 0-72" stroke="#a46b09" stroke-width="3" fill="none"/></g>
</defs>
<!-- paired laurel branches -->
<g stroke="#a87508" stroke-width="8" stroke-linecap="round" fill="none"><path d="M232 779C88 673 58 488 138 302"/><path d="M768 779c144-106 174-291 94-477"/></g>
