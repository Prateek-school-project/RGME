<!-- main medallion -->
<circle cx="500" cy="453" r="324" fill="#5c0923" opacity=".25"/>
<circle cx="500" cy="440" r="326" fill="url(#red)" stroke="url(#gold)" stroke-width="13"/>
<circle cx="500" cy="440" r="304" fill="none" stroke="#fbe6d6" stroke-width="4" opacity=".88"/>
<circle cx="500" cy="440" r="238" fill="#fffdf7" stroke="#efc7c7" stroke-width="8"/>
